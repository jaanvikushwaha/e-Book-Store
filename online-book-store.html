<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online Book Store</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',sans-serif;background:linear-gradient(120deg,#e0f7fa,#f3e5f5);color:#455a64;min-height:100vh}
/* TOP FRAME */
#top{text-align:center;padding:8px 10px}
.brand{position:relative;display:flex;align-items:center;justify-content:center;gap:15px;padding:0 clamp(56px,11vw,100px)}
.logo{position:absolute;left:6px;top:50%;transform:translateY(-50%);height:clamp(48px,10vw,80px);width:auto;mix-blend-mode:multiply}
h1{margin:0;font-size:28px;color:#37474f}
h1 span{color:#26a69a}
small{color:#78909c}
nav{display:flex;justify-content:center;gap:clamp(4px,1vw,12px);padding:8px;flex-wrap:nowrap}
nav a,#left a{cursor:pointer;padding:8px 22px;border-radius:20px;background:#fff;color:#455a64;text-decoration:none;font-weight:600;box-shadow:0 2px 6px #0002;transition:.3s}
nav a{padding:8px clamp(8px,1.8vw,22px);font-size:clamp(11px,2.2vw,16px);white-space:nowrap}
nav a:hover{background:#26a69a;color:#fff;transform:translateY(-3px)}
/* LAYOUT */
#wrap{display:flex;gap:10px;padding:0 10px 20px}
#left{width:20%;min-width:130px;text-align:center;padding:10px 0}
#left h3{color:#37474f;margin:5px 0 15px}
#left a{display:block;margin:10px 0;padding:12px}
#left a:hover{background:#26a69a;color:#fff;transform:translateX(8px)}
#right{flex:1;text-align:center;min-width:0}
img.emoji{height:1em;width:1em;vertical-align:-.12em;margin:0 .05em}
/* COMMON */
.c{max-width:900px;margin:10px auto;padding:20px;background:#fff;border-radius:20px;box-shadow:0 6px 20px #0002;animation:up .6s}
.c.sm{max-width:400px}
h2{color:#37474f;margin:0 0 10px}
button,.btn{padding:8px 18px;border:0;border-radius:20px;background:#26a69a;color:#fff;cursor:pointer;text-decoration:none;font:600 14px 'Segoe UI';display:inline-block}
button:hover,.btn:hover{background:#00897b}
.bar{background:#e0f7fa;border-radius:20px;padding:8px}
#g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px}
.k{border:1px solid #eceff1;border-radius:14px;padding:12px;transition:.3s}
.k:hover{box-shadow:0 4px 14px #0002;transform:translateY(-3px)}
.cover{width:140px;height:180px;object-fit:contain;background:#f5f5f5;border-radius:8px}
.k h3{font-size:15px}
input{width:90%;padding:10px;margin:6px 0;border:1px solid #b0bec5;border-radius:10px}
.tabs button{margin:4px}
.tabs button.on{background:#00897b}
ul{text-align:left;display:inline-block;line-height:1.9}
.book{font-size:90px;display:inline-block;animation:float 3s ease-in-out infinite}
.sub{color:#78909c;font-weight:500;font-size:18px}
.id{display:inline-block;margin:12px 0;padding:8px 18px;border-radius:20px;background:#e0f7fa;font-weight:600;color:#00897b}
.ok{width:110px}
.ok circle,.ok path{fill:none;stroke:#26a69a;stroke-width:6;stroke-linecap:round;stroke-dasharray:300;animation:draw 1s .3s both}
.ok path{stroke-dasharray:60;animation-delay:.9s}
i.cf{position:fixed;top:-20px;width:9px;height:14px;animation:fall linear forwards;z-index:9}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#37474f;color:#fff;padding:10px 22px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
@keyframes float{50%{transform:translateY(-15px) rotate(8deg)}}
@keyframes draw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(max-width:600px){#wrap{flex-direction:column}#left{width:100%;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}#left h3{width:100%;margin:0}#left a{margin:0;padding:8px 14px}#g{grid-template-columns:repeat(2,1fr);gap:8px}.cover{height:130px;max-width:100%}}
</style>
</head>

<script>
var D={
CSE:[["Data Structures Using C","Reema Thareja","Oxford University Press",450,"Data%20Structures%20Using%20C"],["Introduction to Algorithms","Cormen et al.","PHI",899,"Introduction%20to%20Algorithms"],["Java: The Complete Reference","Herbert Schildt","McGraw Hill",650,"Java%20The%20Complete%20Reference"],["Database System Concepts","Silberschatz","McGraw Hill",720,"Database%20System%20Concepts"],["Web Technologies","Uttam K. Roy","Oxford University Press",531,"Web%20Technologies"],["PHP & MySQL Web Development","Luke Welling & Laura Thompson","Pearson",898,"PHP%20and%20MySQL%20Web%20Development"]],
ECE:[["Digital Design","M. Morris Mano","Pearson",480,"Digital%20Design%20Morris%20Mano"],["Signals and Systems","Alan Oppenheim","Pearson",560,"Signals%20and%20Systems"],["Digital Communications","John Proakis","McGraw Hill",780,"Digital%20Communications"],["Electronic Devices and Circuit Theory","Robert Boylestad","Pearson",520,"Electronic%20Devices%20and%20Circuit%20Theory"],["Microelectronic Circuits","Sedra & Smith","Oxford University Press",850,"Microelectronic%20Circuits"],["Communication Systems","Simon Haykin","Wiley",640,"Communication%20Systems%20Haykin"]],
EEE:[["Fundamentals of Electric Circuits","Alexander & Sadiku","McGraw Hill",690,"Fundamentals%20of%20Electric%20Circuits"],["Electric Machinery","A. E. Fitzgerald","McGraw Hill",740,"Electric%20Machinery"],["Power System Analysis","Hadi Saadat","McGraw Hill",610,"Power%20System%20Analysis"],["Principles of Power Systems","V. K. Mehta","S. Chand",450,"Principles%20of%20Power%20Systems"],["Control Systems Engineering","Norman Nise","Wiley",590,"Control%20Systems%20Engineering"],["Power Electronics","M. H. Rashid","Pearson",720,"Power%20Electronics%20Rashid"]],
MECH:[["Theory of Machines","S. S. Rattan","McGraw Hill",520,"Theory%20of%20Machines"],["Fluid Mechanics","R. K. Bansal","Laxmi Publications",430,"Fluid%20Mechanics%20Bansal"],["Engineering Thermodynamics","P. K. Nag","McGraw Hill",560,"Engineering%20Thermodynamics"],["Strength of Materials","R. K. Bansal","Laxmi Publications",410,"Strength%20of%20Materials"],["Automation, Production Systems and CIM","M. P. Groover","Pearson",680,"Automation%20Production%20Systems"],["Introduction to Robotics","John Craig","Pearson",790,"Introduction%20to%20Robotics"]]
};
var FULL={CSE:"Computer Science and <span>Engineering</span>",ECE:"Electronics and <span>Communication Engineering</span>",EEE:"Electrical and <span>Electronics Engineering</span>",MECH:"Mechanical <span>Engineering</span>"};
var cart=[],branch="CSE",R=document.getElementById("right");

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function total(){return cart.reduce(function(a,b){return a+b[3]},0)}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},1400)}
function upd(){document.getElementById("cc").textContent=cart.length}

function go(p){
  if(D[p]){branch=p;return branchPage(p)}
  ({home:home,login:login,register:register,catalogue:catalogue,cart:cartPage,order:order})[p]();
  window.scrollTo({top:0,behavior:"smooth"});
}

function home(){
  R.innerHTML='<div class="c" style="max-width:520px;margin-top:30px;padding:30px"><div class="book">📚</div><h1>Welcome to the Online <span>Book Store</span>!!!</h1><div class="sub">"A Huge Collection Of Engineering E-Books"</div><p><a class="btn" onclick="go(\'catalogue\')">Browse catalogue</a></p></div>';
}

function login(){
  R.innerHTML='<div class="c sm"><h2><span style="color:#26a69a">Login</span></h2><form id="lf"><input id="u" placeholder="Username" required><input type="password" placeholder="Password" required><br><button>Login</button></form><p>New user? <a href="#" onclick="go(\'register\');return false">Register</a></p></div>';
  document.getElementById("lf").onsubmit=function(e){e.preventDefault();toast("Welcome, "+document.getElementById("u").value+"!");setTimeout(function(){go("catalogue")},900)};
}

function register(){
  R.innerHTML='<div class="c sm"><h2><span style="color:#26a69a">Registration</span></h2><form id="rf"><input placeholder="Full name" required><input type="email" placeholder="Email" required><input id="p" type="password" placeholder="Password" required><input id="r" type="password" placeholder="Confirm password" required><br><button>Register</button></form></div>';
  document.getElementById("rf").onsubmit=function(e){e.preventDefault();
    if(document.getElementById("p").value!==document.getElementById("r").value){toast("Passwords do not match");return}
    toast("Registered successfully!");setTimeout(function(){go("login")},900)};
}

function catalogue(){
  R.innerHTML='<div class="c" style="max-width:1000px"><h2><span style="color:#26a69a">Book</span> Catalogue</h2><p>Find your engineering textbooks</p><div class="tabs" id="tabs"></div><p class="bar" id="b"></p><div id="g"></div></div>';
  var tabs=document.getElementById("tabs");
  Object.keys(D).forEach(function(k){var b=document.createElement("button");b.textContent=k;if(k===branch)b.className="on";b.onclick=function(){branch=k;catalogue()};tabs.appendChild(b)});
  document.getElementById("b").innerHTML='Branch: <b>'+branch+'</b> | Cart: <b>'+cart.length+'</b> | Total: ₹<b>'+total()+'</b> <a class="btn" onclick="go(\'cart\')">View cart</a>';
  document.getElementById("g").innerHTML=D[branch].map(function(x,i){
    return '<div class="k"><img class="cover" loading="lazy" src="https://covers.openlibrary.org/b/title/'+x[4]+'-M.jpg" alt="cover" onerror="this.onerror=null;this.src=\'https://placehold.co/140x180/e0f7fa/455a64?text=Book+Cover\'"><h3>'+esc(x[0])+'</h3><small>'+esc(x[1])+'<br>'+esc(x[2])+'</small><p><b>₹'+x[3]+'</b></p><button onclick="add('+i+')">Add to Cart</button></div>'}).join("");
}
function add(i){cart.push(D[branch][i]);upd();toast("Added: "+D[branch][i][0]);
  document.getElementById("b").innerHTML='Branch: <b>'+branch+'</b> | Cart: <b>'+cart.length+'</b> | Total: ₹<b>'+total()+'</b> <a class="btn" onclick="go(\'cart\')">View cart</a>'}

function branchPage(k){
  R.innerHTML='<div class="c"><h2 style="font-size:26px">'+FULL[k].replace("<span>",'<span style="color:#26a69a">')+'</h2><ul>'+D[k].map(function(x){return'<li>'+esc(x[0])+'</li>'}).join("")+'</ul><p><a class="btn" onclick="go(\'catalogue\')">Shop '+k+' books</a></p></div>';
}

function cartPage(){
  if(!cart.length){R.innerHTML='<div class="c sm"><h2>🛒 Your cart is empty</h2><p><a class="btn" onclick="go(\'catalogue\')">Browse catalogue</a></p></div>';return}
  R.innerHTML='<div class="c"><h2>🛒 Your Cart</h2><ul style="display:block;padding:0;list-style:none">'+cart.map(function(x,i){return'<li style="border-bottom:1px solid #eceff1;padding:4px 0">'+esc(x[0])+' — <b>₹'+x[3]+'</b> <button style="padding:3px 10px;background:#90a4ae" onclick="cart.splice('+i+',1);upd();cartPage()">remove</button></li>'}).join("")+'</ul><p class="bar">Total: ₹<b>'+total()+'</b></p><a class="btn" onclick="go(\'order\')">Place order</a></div>';
}

function order(){
  if(!cart.length){toast("Add a book first");return go("catalogue")}
  var id="#OBS"+Math.floor(10000+Math.random()*90000),d=new Date(Date.now()+5*864e5).toDateString(),amt=total();
  cart=[];upd();
  R.innerHTML='<div class="c sm" style="padding:30px"><svg class="ok" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44"/><path d="M30 52l14 14 27-30"/></svg><h2>Order <span style="color:#26a69a">Placed!</span></h2><p>Thank you for shopping with <b>Online Book Store</b>.<br>Your books are on the way.</p><div class="id">Order ID: '+id+'</div><p>Amount paid: <b>₹'+amt+'</b><br>Estimated delivery: <b>'+d+'</b></p><a class="btn" onclick="go(\'catalogue\')">Continue shopping</a></div>';
  for(var k=0;k<50;k++){var e=document.createElement("i");e.className="cf";e.style.cssText="left:"+Math.random()*100+"%;background:hsl("+Math.random()*360+",75%,60%);animation-duration:"+(2+Math.random()*3)+"s;animation-delay:"+Math.random()*1.5+"s";document.body.appendChild(e);(function(el){setTimeout(function(){el.remove()},6000)})(e)}
}

home();
</script>
